<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGFW HTTP Test - Suricata Rules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --bg: #0a0f1a; --card: #131b2e; --border: #1e2d4a; --accent: #3b82f6; --danger: #ef4444; --success: #22c55e; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, #1e3a5f, #0f172a); padding: 25px 0; border-bottom: 2px solid var(--accent); }
        .header h1 { margin: 0; font-size: 1.8rem; }
        .badge-http { background: var(--success); color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.75rem; }
        .server-info { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin: 20px 0; }
        .server-url { font-family: 'Consolas', monospace; font-size: 1.1rem; color: var(--success); background: #0d1117; padding: 10px 15px; border-radius: 6px; display: inline-block; }
        .topology { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; padding: 20px; background: var(--card); border-radius: 10px; margin-bottom: 20px; }
        .topo-box { background: #1a2744; border: 2px solid var(--border); border-radius: 10px; padding: 15px 25px; text-align: center; }
        .topo-box.client { border-color: var(--accent); }
        .topo-box.ngfw { border-color: var(--danger); }
        .topo-box.server { border-color: var(--success); }
        .topo-arrow { color: #64748b; font-size: 1.5rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat { background: var(--card); border-radius: 10px; padding: 20px; text-align: center; }
        .stat h3 { margin: 0; font-size: 2rem; }
        .stat p { margin: 5px 0 0; color: #64748b; font-size: 0.85rem; }
        .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 15px; }
        .test-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; transition: all 0.2s; }
        .test-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); border-color: var(--accent); }
        .test-card.cat-malware { border-left: 4px solid var(--danger); }
        .test-card.cat-virus { border-left: 4px solid #f97316; }
        .test-card.cat-exploit { border-left: 4px solid #a855f7; }
        .test-card.cat-web { border-left: 4px solid var(--accent); }
        .test-card.cat-sandbox { border-left: 4px solid #06b6d4; }
        .card-header { background: rgba(255,255,255,0.03); padding: 12px 15px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
        .test-num { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0; }
        .sid-badge { background: linear-gradient(135deg, #059669, #047857); padding: 5px 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; font-weight: 600; }
        .card-body { padding: 15px; }
        .endpoint-url { background: #0d1117; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; color: var(--success); margin: 10px 0; word-break: break-all; }
        .severity { padding: 4px 10px; border-radius: 5px; font-size: 0.75rem; font-weight: 600; }
        .severity-critical { background: var(--danger); }
        .severity-high { background: #f97316; }
        .severity-medium { background: #eab308; color: #000; }
        .card-footer { padding: 12px 15px; background: rgba(0,0,0,0.2); display: flex; gap: 10px; }
        .btn-test { flex: 1; background: linear-gradient(135deg, #dc2626, #b91c1c); border: none; color: white; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-test:hover { background: linear-gradient(135deg, #ef4444, #dc2626); transform: scale(1.02); }
        .btn-open { background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 10px 15px; border-radius: 6px; text-decoration: none; transition: all 0.2s; }
        .btn-open:hover { background: var(--accent); color: white; }
        .results { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 3px solid var(--accent); max-height: 280px; transform: translateY(100%); transition: transform 0.3s; z-index: 1000; }
        .results.show { transform: translateY(0); }
        .results-header { background: #0d1117; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .results-body { max-height: 220px; overflow-y: auto; padding: 15px 20px; }
        .result-item { background: #0d1117; border: 1px solid var(--border); border-radius: 8px; padding: 12px 15px; margin-bottom: 10px; border-left: 4px solid var(--success); }
        .result-item.blocked { border-left-color: var(--danger); }
        .content-wrap { padding-bottom: 100px; }
        @media (max-width: 768px) { .test-grid { grid-template-columns: 1fr; } .topology { flex-direction: column; } .topo-arrow { transform: rotate(90deg); } }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h1><i class="fas fa-shield-virus text-danger me-2"></i>NGFW Test Suite</h1>
                    <p class="mb-0 mt-2 text-secondary">
                        <span class="badge-http me-2">HTTP</span>
                        HiPV_53cUr1tY — 31 Suricata rules (et-virus & et-malware)
                    </p>
                </div>
                <button class="btn btn-success btn-lg" onclick="runAllTests()">
                    <i class="fas fa-play me-2"></i>Run All 31 Tests
                </button>
            </div>
        </div>
    </div>

    <div class="container py-4 content-wrap">
        <div class="server-info">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h5 class="mb-2"><i class="fas fa-server me-2 text-success"></i>Server URL</h5>
                    <div class="server-url" id="serverUrl">Loading...</div>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <small class="text-secondary d-block mb-1">Protocol</small>
                    <span class="badge-http" style="font-size: 1rem; padding: 8px 20px;">HTTP (Plaintext)</span>
                </div>
            </div>
        </div>

        <div class="topology">
            <div class="topo-box client">
                <i class="fas fa-laptop fa-2x mb-2 d-block" style="color: var(--accent)"></i>
                <strong>Client</strong><br>
                <small class="text-secondary">Browser</small>
            </div>
            <div class="topo-arrow"><i class="fas fa-arrow-right"></i></div>
            <div class="topo-box ngfw">
                <i class="fas fa-shield-alt fa-2x mb-2 d-block" style="color: var(--danger)"></i>
                <strong>NGFW</strong><br>
                <small class="text-secondary">Suricata IDS/IPS</small>
            </div>
            <div class="topo-arrow"><i class="fas fa-arrow-right"></i></div>
            <div class="topo-box server">
                <i class="fas fa-server fa-2x mb-2 d-block" style="color: var(--success)"></i>
                <strong>HTTP Server</strong><br>
                <small class="text-secondary">Port 80 / Ngrok</small>
            </div>
        </div>

        <div class="stats">
            <div class="stat"><h3 class="text-primary">31</h3><p>Test Cases</p></div>
            <div class="stat"><h3 class="text-danger">15</h3><p>MALWARE</p></div>
            <div class="stat"><h3 style="color:#f97316">11</h3><p>VIRUS</p></div>
            <div class="stat"><h3 style="color:#a855f7">3</h3><p>EXPLOIT-KIT</p></div>
            <div class="stat"><h3 class="text-info">2</h3><p>SANDBOX</p></div>
        </div>

        <div class="test-grid" id="testGrid"></div>
    </div>

    <div class="results" id="results">
        <div class="results-header">
            <h6 class="mb-0"><i class="fas fa-terminal me-2"></i>Test Results</h6>
            <div>
                <button class="btn btn-sm btn-outline-secondary me-2" onclick="clearResults()"><i class="fas fa-trash"></i></button>
                <button class="btn btn-sm btn-outline-light" onclick="toggleResults()"><i class="fas fa-chevron-down"></i></button>
            </div>
        </div>
        <div class="results-body" id="resultsBody"></div>
    </div>

    <script>
        const API_BASE = window.location.origin + '/ngfw-test';
        document.getElementById('serverUrl').textContent = API_BASE + '/';

        const TEST_CASES = [
            { id: 1, sid: '5900006', name: 'EICAR Test File - HTTP Download', cat: 'MALWARE', severity: 'HIGH', rule: 'content:"X5O!P%@AP[4|5C|PZX54(P^)7CC)7}|24|EICAR"' },
            { id: 2, sid: '5900012', name: 'Suspicious EXE Download', cat: 'MALWARE', severity: 'HIGH', rule: 'content:"MZ"; depth:2' },
            { id: 3, sid: '5900014', name: 'Macro-Enabled Document', cat: 'MALWARE', severity: 'HIGH', rule: 'content:"PK"; depth:2' },
            { id: 4, sid: '5900015', name: 'Windows Script File', cat: 'MALWARE', severity: 'HIGH', rule: 'content:"WScript"' },
            { id: 5, sid: '5900016', name: 'PE Executable', cat: 'MALWARE', severity: 'CRITICAL', rule: 'content:"MZ"; content:"PE|00 00|"' },
            { id: 6, sid: '5900029', name: 'Coinhive Cryptominer', cat: 'MALWARE', severity: 'MEDIUM', rule: 'content:"coinhive"' },
            { id: 7, sid: '5900032', name: 'CryptoLoot Miner', cat: 'MALWARE', severity: 'MEDIUM', rule: 'content:"crypto-loot"' },
            { id: 8, sid: '5900035', name: 'JSECoin Miner', cat: 'MALWARE', severity: 'MEDIUM', rule: 'content:"jsecoin"' },
            { id: 9, sid: '5900044', name: 'RIG Exploit Kit', cat: 'EXPLOIT-KIT', severity: 'HIGH', rule: 'content:"iframe"' },
            { id: 10, sid: '5900045', name: 'Fallout Exploit Kit', cat: 'EXPLOIT-KIT', severity: 'HIGH', rule: 'content:"FWS"; depth:3' },
            { id: 11, sid: '5900048', name: 'ZIP with EXE', cat: 'MALWARE', severity: 'HIGH', rule: 'content:"PK|03 04|"; content:".exe"' },
            { id: 12, sid: '5900049', name: 'HTML Smuggling Base64', cat: 'MALWARE', severity: 'CRITICAL', rule: 'content:"data:application/octet-stream;base64"' },
            { id: 13, sid: '5900063', name: 'VirtualBox Detection', cat: 'ANTI-SANDBOX', severity: 'MEDIUM', rule: 'content:"VBoxService"' },
            { id: 14, sid: '5900064', name: 'VMware Detection', cat: 'ANTI-SANDBOX', severity: 'MEDIUM', rule: 'content:"vmtoolsd"' },
            { id: 15, sid: '5900070', name: 'EICAR Attachment', cat: 'MALWARE', severity: 'HIGH', rule: 'Content-Disposition; filename="eicar"' },
            { id: 16, sid: '6400000', name: 'PE with Auto-Run', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"MZ"; content:"autorun"' },
            { id: 17, sid: '6400001', name: 'Macro Shell Execute', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"Shell"; content:"Execute"' },
            { id: 18, sid: '6400002', name: 'Word AutoOpen', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"AutoOpen"' },
            { id: 19, sid: '6400003', name: 'Excel Auto_Open', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"Auto_Open"' },
            { id: 20, sid: '6400007', name: 'Macro CreateObject', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"CreateObject"' },
            { id: 21, sid: '6400011', name: 'VBScript Replication', cat: 'VIRUS', severity: 'CRITICAL', rule: 'content:"WScript.Shell"; content:"CopyFile"' },
            { id: 22, sid: '6400012', name: 'JS FileSystem', cat: 'VIRUS', severity: 'CRITICAL', rule: 'content:"ActiveXObject"; content:"Scripting.FileSystemObject"' },
            { id: 23, sid: '6400013', name: 'Batch Replication', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"copy"; content:"%0"' },
            { id: 24, sid: '6400020', name: 'Java Class File', cat: 'VIRUS', severity: 'HIGH', rule: 'content:"|CA FE BA BE|"' },
            { id: 25, sid: '6400021', name: 'PDF JavaScript', cat: 'VIRUS', severity: 'CRITICAL', rule: 'content:"/JS"; content:"/JavaScript"' },
            { id: 26, sid: '6400026', name: 'SQLi SELECT', cat: 'WEB-ATTACK', severity: 'HIGH',
              rule: 'http.uri: /view_recent.asp? + currentpage= + SELECT + FROM',
              triggerPath: '/ngfw-test/view_recent.asp?currentpage=1 UNION SELECT username,password FROM users' },
            { id: 27, sid: '6400027', name: 'SQLi UNION', cat: 'WEB-ATTACK', severity: 'HIGH',
              rule: 'http.uri: /view_recent.asp? + currentpage= + UNION + SELECT',
              triggerPath: '/ngfw-test/view_recent.asp?currentpage=1 UNION SELECT * FROM admin WHERE 1=1' },
            { id: 28, sid: '6400028', name: 'SQLi INSERT', cat: 'WEB-ATTACK', severity: 'HIGH',
              rule: 'http.uri: /view_recent.asp? + currentpage= + INSERT + INTO',
              triggerPath: '/ngfw-test/view_recent.asp?currentpage=1; INSERT INTO users VALUES (999,"hacker","owned")' },
            { id: 29, sid: '6400032', name: 'Java Exploit Kit', cat: 'EXPLOIT-KIT', severity: 'CRITICAL', rule: 'content:"PK"; content:"SunJCE.class"' },
            { id: 30, sid: '6400009', name: 'PE File Infector Pattern', cat: 'VIRUS', severity: 'CRITICAL',
              rule: 'file_data; content:"MZ"; depth:2; content:"|E9|"; distance:58; within:3' },
            { id: 31, sid: '5915100', name: 'NetSupport Malware PS1', cat: 'MALWARE', severity: 'CRITICAL',
              rule: 'POST UA:"NetSupport Manager/1.3" + CMD=&CLIENT_ADDR=&PORT=&MACADDRESS= (download: .ps1 sample)',
              triggerPath: '/ngfw-test/test/5915100' }
        ];

        function getCatClass(cat) {
            const map = { 'MALWARE': 'cat-malware', 'VIRUS': 'cat-virus', 'EXPLOIT-KIT': 'cat-exploit', 'WEB-ATTACK': 'cat-web', 'ANTI-SANDBOX': 'cat-sandbox' };
            return map[cat] || '';
        }

        function getSevClass(sev) {
            const map = { 'CRITICAL': 'severity-critical', 'HIGH': 'severity-high', 'MEDIUM': 'severity-medium' };
            return map[sev] || 'bg-secondary';
        }

        function getTriggerUrl(tc) {
            if (tc.triggerPath) {
                // triggerPath đã chứa /ngfw-test/ prefix
                return window.location.origin + tc.triggerPath;
            }
            return API_BASE + `/test/${tc.sid}`;
        }

        function renderGrid() {
            const grid = document.getElementById('testGrid');
            grid.innerHTML = TEST_CASES.map(tc => `
                <div class="test-card ${getCatClass(tc.cat)}">
                    <div class="card-header">
                        <div class="test-num">${tc.id}</div>
                        <div class="flex-grow-1">
                            <div class="fw-bold">${tc.name}</div>
                            <small class="text-secondary">${tc.cat}</small>
                        </div>
                        <span class="sid-badge">SID ${tc.sid}</span>
                    </div>
                    <div class="card-body">
                        <span class="severity ${getSevClass(tc.severity)}">${tc.severity}</span>
                        <div class="endpoint-url">${getTriggerUrl(tc)}</div>
                        <small class="text-secondary"><code>${tc.rule}</code></small>
                    </div>
                    <div class="card-footer">
                        <button class="btn-test" onclick="runTest(${tc.id})"><i class="fas fa-play me-1"></i>Test</button>
                        <a href="${getTriggerUrl(tc)}" target="_blank" class="btn-open"><i class="fas fa-external-link-alt"></i></a>
                    </div>
                </div>
            `).join('');
        }

        function showResults() { document.getElementById('results').classList.add('show'); }
        function toggleResults() { document.getElementById('results').classList.toggle('show'); }
        function clearResults() { document.getElementById('resultsBody').innerHTML = ''; }

        async function runTest(id) {
            const tc = TEST_CASES.find(t => t.id === id);
            if (!tc) return;
            showResults();
            const body = document.getElementById('resultsBody');
            const rid = `r-${tc.id}-${Date.now()}`;
            body.insertAdjacentHTML('afterbegin', `<div class="result-item" id="${rid}"><i class="fas fa-spinner fa-spin me-2"></i>Testing SID ${tc.sid}...</div>`);
            
            try {
                const start = Date.now();
                const res = await fetch(getTriggerUrl(tc));
                const ms = Date.now() - start;
                document.getElementById(rid).innerHTML = `
                    <div class="d-flex justify-content-between mb-2">
                        <strong><span class="badge bg-primary me-2">#${tc.id}</span>SID ${tc.sid}: ${tc.name}</strong>
                        <span class="badge bg-success">HTTP ${res.status} - ${ms}ms</span>
                    </div>
                    <small class="text-warning"><i class="fas fa-exclamation-triangle me-1"></i>Check NGFW Dashboard for SID <strong>${tc.sid}</strong></small>
                `;
            } catch (e) {
                document.getElementById(rid).className = 'result-item blocked';
                document.getElementById(rid).innerHTML = `
                    <strong><span class="badge bg-danger me-2">#${tc.id}</span>SID ${tc.sid} - BLOCKED</strong>
                    <div class="small text-success mt-1"><i class="fas fa-shield-alt me-1"></i>NGFW blocked! Check logs for SID ${tc.sid}</div>
                `;
            }
        }

        async function runAllTests() {
            if (!confirm('Run all 31 tests? This will trigger security alerts on your NGFW.')) return;
            showResults();
            clearResults();
            for (const tc of TEST_CASES) {
                await runTest(tc.id);
                await new Promise(r => setTimeout(r, 300));
            }
        }

        renderGrid();
    </script>
</body>
</html>
